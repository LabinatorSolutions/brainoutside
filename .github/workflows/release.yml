# Build and publish the image on every version tag.
#
# ghcr.io/<owner>/brainoutside:<semver>, multi-arch (amd64 + arm64 — the
# arm half is what makes a Raspberry Pi or a Hetzner CAX box a valid
# home for a brain). The image name derives from the repository, so a
# fork publishes under its own owner without editing this file.
#
# The Dockerfile's build-time smoke test (the claude-agent-sdk bundled
# CLI must answer --version) runs per-platform here, so a pin that
# breaks on arm64 fails the release rather than the first request.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
