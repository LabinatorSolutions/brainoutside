{% load i18n %}
{# light/dark theme toggle. Persists in localStorage; respects OS default on first visit. #}
{# Usage: {% include "partials/_theme_toggle.html" %} #}
<button
  type="button"
  x-data="{
    dark: document.documentElement.classList.contains('dark'),
    toggle() {
      this.dark = !this.dark;
      document.documentElement.classList.toggle('dark', this.dark);
      try { localStorage.setItem('theme', this.dark ? 'dark' : 'light'); } catch (e) {}
    }
  }"
  x-on:click="toggle()"
  class="inline-flex h-9 w-9 items-center justify-center rounded-md text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-zinc-100 focus-visible:ring-2 focus-visible:ring-brand-500"
  :aria-label="dark ? '{% trans 'Switch to light theme' %}' : '{% trans 'Switch to dark theme' %}'"
  :title="dark ? '{% trans 'Light mode' %}' : '{% trans 'Dark mode' %}'"
>
  {# Sun (shown in dark mode) #}
  <svg x-show="dark" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
  </svg>
  {# Moon (shown in light mode) #}
  <svg x-show="!dark" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
  </svg>
</button>
